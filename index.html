<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Pantas - Bijak Belajar</title>
    <!-- Menggunakan Tailwind CSS untuk rekaan moden -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen py-8">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-slate-800">Daftar Sekarang</h2>
            <p class="text-sm text-slate-500 mt-1">Sila masukkan maklumat customer dan reseller untuk diteruskan.</p>
        </div>

        <form id="regForm" onsubmit="handleRegister(event)" class="space-y-6">
            
            <!-- MAKLUMAT CUSTOMER -->
            <div class="space-y-4 pb-4 border-b border-slate-200">
                <h3 class="text-md font-semibold text-blue-600">Maklumat Customer</h3>
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Penuh Customer</label>
                    <input type="text" id="cust_nama" required 
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="Contoh: Siti Aminah">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Emel Customer</label>
                    <input type="email" id="cust_email" required 
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="customer@email.com">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">No. Telefon Customer</label>
                    <input type="tel" id="cust_nofon" required 
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="0123456789">
                </div>
            </div>

            <!-- MAKLUMAT RESELLER (DATA AKAN DI-AUTO FILL KE BCL) -->
            <div class="space-y-4">
                <h3 class="text-md font-semibold text-emerald-600">Maklumat Reseller</h3>
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Penuh Reseller</label>
                    <input type="text" id="reseller_nama" required 
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="Contoh: Ahmad Ali">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Emel Reseller</label>
                    <input type="email" id="reseller_email" required 
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="reseller@email.com">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">No. Telefon Reseller</label>
                    <input type="tel" id="reseller_nofon" required 
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="0189876543">
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">
                Register & Teruskan
            </button>
        </form>
    </div>

    <script>
        function handleRegister(event) {
            // Halang borang daripada 'submit' cara biasa
            event.preventDefault();

            // AMBIL DATA RESELLER SAHAJA UNTUK DIBAWA KE PAGE BCL
            const nama = encodeURIComponent(document.getElementById('reseller_nama').value);
            const email = encodeURIComponent(document.getElementById('reseller_email').value);
            const nofon = encodeURIComponent(document.getElementById('reseller_nofon').value);

            // URL Destinasi yang diberikan
            const baseUrl = "https://bijakbelajar.bcl.my/form/customer-registration";

            // Bina URL target menggunakan data reseller sahaja
            const targetUrl = `${baseUrl}?name=${nama}&email=${email}&phone=${nofon}`;

            // Bawa pengguna secara automatik ke halaman tersebut
            window.location.href = targetUrl;
        }
    </script>

</body>
</html>
