<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Pelanggan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Daftar Akaun</h2>
        <form id="registrationForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="nama">Nama Penuh</label>
                <input type="text" id="nama" required placeholder="Masukkan nama anda">
            </div>
            
            <div class="form-group">
                <label for="email">Emel</label>
                <input type="email" id="email" required placeholder="nama@contoh.com">
            </div>
            
            <div class="form-group">
                <label for="phone">No Telefon</label>
                <input type="tel" id="phone" required placeholder="0123456789">
            </div>
            
            <button type="submit">Register</button>
        </form>
    </div>

    <script>
        function handleRegister(event) {
            // Halang borang daripada hantar secara lalai
            event.preventDefault();

            // Ambil nilai dari input pengguna
            const nama = document.getElementById('nama').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;

            // URL asas tujuan
            const baseUrl = "https://apps2.klikwoi.net/page/customer-registration-";

            // NOTA: Gantikan 'name', 'email', 'phone' di bawah dengan parameter sebenar 
            // yang digunakan oleh sistem klikwoi.net (jika berbeza).
           const targetUrl = `${baseUrl}?nama=${encodeURIComponent(nama)}&email=${encodeURIComponent(email)}&telefon=${encodeURIComponent(phone)}`;
            
            // Bawa pengguna secara auto ke page tersebut
            window.location.href = targetUrl;
        }
    </script>

</body>
</html>
