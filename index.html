<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Pantas - Bijak Belajar</title>
    <!-- Menggunakan Tailwind CSS untuk rekaan moden -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          emailjs.init("fn_2mv2164kWUf8J7"); // Public Key anda
       })();
    </script>

  <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Config Anda[cite: 1]
        const firebaseConfig = {
            apiKey: "AIzaSyDXc06B8WLtqjkG0aScBHrd3L3M-n_5okc",
            authDomain: "grammar-hub-6af80.firebaseapp.com",
            databaseURL: "https://grammar-hub-6af80-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "grammar-hub-6af80",
            storageBucket: "grammar-hub-6af80.firebasestorage.app",
            messagingSenderId: "1092171234032",
            appId: "1:1092171234032:web:7cc8efefb812993500e035"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Letakkan fungsi handleRegister dalam skop global supaya boleh diakses oleh onsubmit form
        window.handleRegister = async function(event) {
            // Halang borang daripada 'submit' cara biasa
            event.preventDefault();

            // Ubah button jadi loading / nyahaktifkan seketika untuk elakkan double-click
            const submitBtn = event.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerText = "Memproses...";

            // Ambil data customer
            const custNama = document.getElementById('cust_nama').value;
            const custEmail = document.getElementById('cust_email').value;
            const custNofon = document.getElementById('cust_nofon').value;
            const defaultPassword = "GH548257af";

            // Ambil data reseller untuk dibawa ke page BCL nanti
            const resellerNama = document.getElementById('reseller_nama').value;
            const resellerEmail = document.getElementById('reseller_email').value;
            const resellerNofon = document.getElementById('reseller_nofon').value;

            try {
                // 1. Create User di Firebase Authentication menggunakan emel customer
                const userCredential = await createUserWithEmailAndPassword(auth, custEmail, defaultPassword);
                const user = userCredential.user;

                // 2. Simpan maklumat tambahan customer dalam Firebase Realtime Database
                await set(ref(db, 'users/' + user.uid), {
                    nama: custNama,
                    email: custEmail,
                    nofon: custNofon,
                    reseller_rujukan: resellerNama,
                    createdAt: new Date().toISOString()
                });

                console.log("Firebase pendaftaran & database berjaya disimpan.");

            } catch (error) {
                console.error("Ralat Firebase:", error);
                alert("Gagal mendaftar ke Firebase: " + error.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "Register & Teruskan";
                return; // Hentikan proses jika gagal daftar Firebase
            }

            // 3. Cuba Hantar Emel Automatik dan tunggu hingga selesai sebelum redirect
            try {
                const templateParams = {
                    to_name: custNama,
                    to_email: custEmail,
                    password: defaultPassword
                };

                // Pastikan menggunakan 'await' supaya skrip menunggu emel selesai dihantar
                await emailjs.send('service_hd5rpgc', 'template_9sh4gw2', templateParams);
                console.log("Emel berjaya dihantar melalui EmailJS.");
            } catch (emailError) {
                console.warn("Amaran: Emel gagal dihantar tetapi pendaftaran kekal berjaya.", emailError);
            }

            // 4. Bina URL target menggunakan data reseller untuk dibawa ke BCL
            const baseUrl = "https://bijakbelajar.bcl.my/form/customer-registration";
            const targetUrl = `${baseUrl}?name=${encodeURIComponent(resellerNama)}&email=${encodeURIComponent(resellerEmail)}&phone=${encodeURIComponent(resellerNofon)}`;

            // Bawa pengguna secara automatik ke halaman tersebut selepas emel selesai diproses
            window.location.href = targetUrl;
        }
    </script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen py-8">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-slate-800">CUSTOMER REGISTRATION</h2>
        </div>

        <form id="regForm" onsubmit="handleRegister(event)" class="space-y-6">
            
            <!-- PERINGATAN PENTING -->
            <div class="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-lg text-sm text-amber-900 space-y-1">
                <p class="font-bold flex items-center gap-1.5">
                    <span>⚠️</span> PERINGATAN PENTING
                </p>
                <p>Sila pastikan semua maklumat customer diisi dengan tepat dan lengkap.</p>
                <p>Pastikan tiada sebarang kesilapan atau typo sebelum meneruskan pendaftaran.</p>
                <p>Pastikan alamat email yang diberikan adalah betul dan aktif.</p>
            </div>

            <!-- MAKLUMAT CUSTOMER -->
            <div class="space-y-4 pb-4 border-b border-slate-200">
                <h3 class="text-md font-semibold text-blue-700">MAKLUMAT CUSTOMER</h3>
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Customer</label>
                    <input type="text" id="cust_nama" required 
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="Contoh: Siti Aminah">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email Customer</label>
                    <input type="email" id="cust_email" required 
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="customer@email.com">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">No. Telefon </label>
                    <input type="tel" id="cust_nofon" required 
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="0123456789">
                </div>
            </div>

            <!-- MAKLUMAT RESELLER (DATA AKAN DI-AUTO FILL KE BCL) -->
            <div class="space-y-4">
                <h3 class="text-md font-semibold text-emerald-700">MAKLUMAT RESELLER</h3>
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Reseller</label>
                    <input type="text" id="reseller_nama" required 
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="Contoh: Ahmad Ali">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email Reseller</label>
                    <input type="email" id="reseller_email" required 
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="reseller@email.com">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">No. Telefon </label>
                    <input type="tel" id="reseller_nofon" required 
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="0189876543">
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">
                Register & Teruskan
            </button>
        </form>
    </div>

</body>
</html>
