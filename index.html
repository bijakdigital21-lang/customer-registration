<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Pantas - Bijak Belajar</title>
    <!-- Menggunakan Tailwind CSS untuk rekaan moden -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-slate-800">Daftar Sekarang</h2>
            <p class="text-sm text-slate-500 mt-1">Sila masukkan maklumat anda untuk diteruskan.</p>
        </div>

        <form id="regForm" onsubmit="handleRegister(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nama Penuh</label>
                <input type="text" id="nama" required 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="Contoh: Ahmad Ali">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Emel</label>
                <input type="email" id="email" required 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="contoh@email.com">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">No. Telefon</label>
                <input type="tel" id="nofon" required 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="0123456789">
            </div>

            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">
                Register & Teruskan
            </button>
        </form>
    </div>

    <script>
        function handleRegister(event) {
            // Halang borang daripada 'submit' cara biasa
            event.preventDefault();

            // Ambil nilai daripada input pengguna
            const nama = encodeURIComponent(document.getElementById('nama').value);
            const email = encodeURIComponent(document.getElementById('email').value);
            const nofon = encodeURIComponent(document.getElementById('nofon').value);

            // URL Destinasi yang diberikan
            const baseUrl = "https://bijakbelajar.bcl.my/form/customer-registration";

            /**
             * NOTA PENTING:
             * Kod di bawah mengikut andaian standard sistem borang menerima parameter URL 
             * (seperti ?name=...&email=...&phone=...). 
             * Sila tukar 'name', 'email', 'phone' mengikut 'name' attribute yang digunakan 
             * pada sistem asal (bijakbelajar.bcl.my).
             */
            const targetUrl = `${baseUrl}?name=${nama}&email=${email}&phone=${nofon}`;

            // Bawa pengguna secara automatik ke halaman tersebut dengan data yang dibawa bersama
            window.location.href = targetUrl;
        }
    </script>

</body>
</html>
